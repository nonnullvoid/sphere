<!doctype html>
<!-- A snapshot from the one-shot template. Self-contained and frozen: never refreshed.
     Made {{generated_iso}}. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="generated" content="{{generated_iso}}" />
    <title>{{title}}</title>
    <style>
      {{chrome}}
    </style>
  </head>
  <body>
    <main class="sphere-page sphere-page--reading">
      <div class="sphere-header">
        <div>
          <h1>{{title}}</h1>
          <p class="sphere-header__sub">{{subtitle}}</p>
        </div>
        <span class="sphere-badge sphere-badge--frozen">Snapshot · {{generated}}</span>
      </div>
      <article class="sphere-prose">
        {{body}}
      </article>
      <footer class="sphere-footer">
        <div>Made {{generated}}, from:</div>
        <ul>
          {{sources}}
        </ul>
      </footer>
    </main>
  </body>
</html>
